    <body></body>
    
    <!-- Define variables first -->
    <script> 

    // Experiment Parameters
    var exp_ab = 'A'                        // A = labels; B = grid 
    var pid = 'ERROR'                       // Prolific ID
    var attention_failures = 0              // for attention checks
    var break_threshold = 7 * 60 * 1000     // for how long to give participant before break times out in ms (set to null for indefinite time)
    var break_timed_out = false             // for breaks
    var start_time = Date.now()
    var PROGRESS_BAR_N = 187                // 186 emotions + 1 for demographics     

    // Initialize variables 
    var labels_variables = ''
    var grid_variables   = ''
    var timeline         = []

    // Run style
    // if running offline (on computer), you need to change exp_id and exp_ab or else it will throw an error
    var ONLINE = true        // true or false
    var PAVLOVIA = true      // true or false

    if (ONLINE) {
    // If running on Pavlovia, read URL parameter values from the link sent to participant.
    // URL example: https://run.pavlovia.org/neurophilmcgill/narratives-exp/?EXPAB=A&PID=YOURNAME
        var urlvar = jsPsych.data.urlVariables();
        exp_ab = urlvar.EXPAB
        pid = urlvar.PID
        // CONDITION = $.urlParam('CONDITION');
    };


    labels_variables = shuffle(video_info_selected)
    grid_variables = labels_variables



 </script>


    <!-- Load plugin (requires variables to be defined first) -->
    <script src="pages/tom.js"></script>
    <script src="pages/thankyou.js"></script>
    <script src="pages/welcome-consent.js"></script>
    <script src="pages/demographics-internetspeed-screening.js"></script>


<script>



    if (exp_ab == 'A'){
        timeline = timeline.concat(WELCOMECONSENT)
        timeline = timeline.concat(DEMOGRAPHICS)
        timeline = timeline.concat(TOM_LABELS)
        timeline = timeline.concat(THANKYOU)
    }
    else if (exp_ab == 'B'){
        timeline = timeline.concat(WELCOMECONSENT)
        timeline = timeline.concat(DEMOGRAPHICS)
        timeline = timeline.concat(TOM_GRID)
        timeline = timeline.concat(THANKYOU)
    }
    else {
        timeline = timeline.concat(ERROR_expab)
    }



    // for running online through Pavlovia
    var pavlovia_init = {
        type: "pavlovia",
        command: "init"
    };
    var pavlovia_finish = {
        type: "pavlovia",
        command: "finish"
    };

    if (PAVLOVIA){
        timeline.unshift(pavlovia_init)
        timeline.push(pavlovia_finish)
    }

    var griddy1 = {
    type: 'html-custom-grid-response-ac',
    around_grid: 'labels',
    stimulus: "If you are paying attention, please click anywhere in the <span style='color: #ff0000;'><strong>bottom left quadrant</strong></span>.<br>Press the <b>space bar</b> when you\'re ready to continue.<br><br>",
    grid_height: 300,
    maintain_aspect_ratio: true,
    xcoord: 20,
    ycoord: 230,
    on_finish: function(data) {
        var x = Number(data.x);
        var y = Number(data.y);
        
        // Check if the click was in the bottom left quadrant
        var passed = (x < 0 && y < 0);

        // Update global failure counter if they fail
        if (!passed) {
        attention_failures += 1;
        }
    }
    }

    var griddy2 = {
    type: 'html-custom-grid-response-ac',
    around_grid: 'labels',
    stimulus: "If you are paying attention, please click anywhere in the <span style='color: #ff0000;'><strong>top left quadrant</strong></span>.<br>Press the <b>space bar</b> when you\'re ready to continue.<br><br>",
    grid_height: 300,
    maintain_aspect_ratio: true,
    xcoord: 20,
    ycoord: 80,
    on_finish: function(data) {
        var x = Number(data.x);
        var y = Number(data.y);
        
        // Check if the click was in the top left quadrant
        var passed = (x < 0 && y > 0);

        // Update global failure counter if they fail
        if (!passed) {
        attention_failures += 1;
        }
    },
    }

    jsPsych.init({
        timeline: [griddy1, griddy2],
        on_finish: function() {
            jsPsych.data.displayData();
            jsPsych.data.get().localSave('csv', 'experiment_data.csv');
        },
        show_progress_bar: true,
        auto_update_progress_bar: false,
    })

    </script>
