    <body></body>
    
    <!-- Define variables first -->
    <script> 

    // ============================================================
    // Recruitment-platform configuration
    // ------------------------------------------------------------
    // This experiment no longer assumes a specific recruitment
    // platform (e.g. Prolific). Configure these two variables for
    // whichever platform you're using, or leave them as null to
    // just show a plain "you're done" screen with no redirect.
    //
    //   REDIRECT_URL    - where to send participants after they
    //                      finish (e.g. a Prolific/SONA/MTurk
    //                      completion URL). Leave as null for none.
    //   COMPLETION_CODE - a code to display on-screen for the
    //                      participant to enter on the recruitment
    //                      platform. Leave as null to not show one.
    // ============================================================
    var REDIRECT_URL = null
    var COMPLETION_CODE = null

    // Experiment Parameters
    var pid = 'ERROR'                       // Participant ID (read from ?PID= URL parameter, if present)
    var attention_failures = 0              // for attention checks
    var break_threshold = 7 * 60 * 1000     // for how long to give participant before break times out in ms (set to null for indefinite time)
    var break_timed_out = false             // for breaks
    var start_time = Date.now()

    // Initialize variables 
    var timeline            = []

    // Run style
    var ONLINE = true        // true or false
    var PAVLOVIA = true      // true or false

    if (ONLINE) {
    // Read URL parameter values from the link sent to participant.
    // URL example: https://run.pavlovia.org/neurophilmcgill/video-tom-gitlab/?PID=YOURNAME
        var urlvar = jsPsych.data.urlVariables();
        pid = urlvar.PID
    };

    // Build the full catalogue from the per-actor video-info files loaded
    // above, restricted to the 6 actors already used in the curated core
    // set (numeric actor IDs 1, 9, 10, 12, 13, 14 correspond to F2, M5,
    // F7, F5, F8, M4 respectively). This keeps the random extras within
    // the same actor pool participants already see, and lets us convert
    // "actor" to the same F/M code format used in the curated set below.
    var actor_code_map = { 1: 'F2', 9: 'M5', 10: 'F7', 12: 'F5', 13: 'F8', 14: 'M4' }

    var full_catalogue = []
      .concat(video_info_01, video_info_02, video_info_03, video_info_04,
              video_info_05, video_info_06, video_info_07, video_info_08,
              video_info_09, video_info_10, video_info_11, video_info_12,
              video_info_13, video_info_14)
      .filter(function (v) { return actor_code_map.hasOwnProperty(v.actor) })
      .map(function (v) {
        var code = actor_code_map[v.actor]
        return {
          name: code + '_' + v.target_emotion,
          player_embed_url: v.player_embed_url,
          width: v.width,
          height: v.height,
          actor: code,                    // normalized to the same F/M code format as video_info_selected
          target_emotion: v.target_emotion
        }
      })

    // Exclude any clip already present in the curated core set
    // (matched by Vimeo URL).
    var selected_urls = video_info_selected.map(function (v) { return v.player_embed_url })
    var catalogue_remainder = full_catalogue.filter(function (v) {
      return selected_urls.indexOf(v.player_embed_url) === -1
    })

    // Draw 10 random extra clips from the remainder. This re-samples on
    // every page load, so each participant sees a different set of 10
    // random clips in addition to the fixed curated 30.
    var random_extras = shuffle(catalogue_remainder).slice(0, 10)

    // ------------------------------------------------------------
    // Stimulus selection
    // ------------------------------------------------------------
    // The "allowed" pool is 40 clips: the 30 curated clips + the 10
    // random extras drawn above. From this pool, 20 clips are chosen
    // ONCE per participant. That same set of 20 is used in Section 1
    // (regular ToM question) and Section 2 (metaperception question),
    // each section in its own random order, so the two sections can
    // be compared.
    //
    // Rules enforced here (and checked before the experiment starts):
    //   - no clip appears twice within a section (de-duplicated by URL)
    //   - the same actor never appears in two consecutive trials
    //     (also across the practice trial -> first Section 1 trial,
    //      and the last Section 1 trial -> first Section 2 trial)
    //   - Section 2 is not in the same order as Section 1
    //   - the 20 clips NOT chosen (rest of the 40) are held out and are
    //     only used for the two attention-check trials, so an attention
    //     check never repeats a clip the participant has already seen in
    //     that section.
    var N_STIMULI_PER_SECTION = 20

    // The practice video is by actor 12 (code F5): avoid starting Section 1 with that actor.
    var practice_actor_code = actor_code_map[12]

    function unique_by_url(list) {
      var seen = {}
      return list.filter(function (v) {
        if (seen[v.player_embed_url]) return false
        seen[v.player_embed_url] = true
        return true
      })
    }

    // Returns a random ordering of `items` in which no two neighbouring
    // clips share an actor and the first clip's actor differs from
    // `prev_actor`. Returns null if no such ordering could be found.
    function order_without_actor_repeats(items, prev_actor) {
      function ok(arr) {
        if (arr[0].actor === prev_actor) return false
        for (var i = 1; i < arr.length; i++) { if (arr[i].actor === arr[i - 1].actor) return false }
        return true
      }
      // 1) plain random shuffles
      for (var t = 0; t < 3000; t++) {
        var cand = shuffle(items.slice())
        if (ok(cand)) return cand
      }
      // 2) randomized greedy fallback: always take from the actor with most clips left
      for (var t2 = 0; t2 < 200; t2++) {
        var left = shuffle(items.slice()), out = [], last = prev_actor
        while (left.length) {
          var counts = {}
          left.forEach(function (v) { counts[v.actor] = (counts[v.actor] || 0) + 1 })
          var allowed = Object.keys(counts).filter(function (a) { return a !== last })
          if (!allowed.length) break
          var best = Math.max.apply(null, allowed.map(function (a) { return counts[a] }))
          var tops = allowed.filter(function (a) { return counts[a] === best })
          var pick_actor = tops[Math.floor(Math.random() * tops.length)]
          var idx = left.findIndex(function (v) { return v.actor === pick_actor })
          out.push(left.splice(idx, 1)[0])
          last = pick_actor
        }
        if (!left.length && ok(out)) return out
      }
      return null
    }

    function same_order(a, b) {
      for (var i = 0; i < a.length; i++) { if (a[i] !== b[i]) return false }
      return true
    }

    var section1_stimuli, section2_stimuli, section_stimulus_set, attention_check_pool
    var stimuli_ok = false
    for (var attempt = 0; attempt < 500 && !stimuli_ok; attempt++) {
      // the 40-clip pool (curated + random extras), de-duplicated
      var stimulus_pool = shuffle(unique_by_url(video_info_selected.concat(random_extras)))
      section_stimulus_set = stimulus_pool.slice(0, N_STIMULI_PER_SECTION)
      attention_check_pool = stimulus_pool.slice(N_STIMULI_PER_SECTION)   // held out

      var o1 = order_without_actor_repeats(section_stimulus_set, practice_actor_code)
      if (!o1) continue
      var o2 = null
      for (var k = 0; k < 50; k++) {
        o2 = order_without_actor_repeats(section_stimulus_set, o1[o1.length - 1].actor)
        if (o2 && !same_order(o1, o2)) break
        o2 = null
      }
      if (!o2) continue
      section1_stimuli = o1
      section2_stimuli = o2
      stimuli_ok = true
    }
    if (!stimuli_ok) { console.error('Could not build stimulus orders that satisfy all constraints.') }

    // Progress bar: 2 increments per stimulus per section (grid + words),
    // plus 2 attention-check increments, plus 1 for demographics and 1 for consent.
    var PROGRESS_BAR_N = (N_STIMULI_PER_SECTION * 2 * 2) + 2 + 2

 </script>

<script>

    timeline = timeline.concat(WELCOMECONSENT)
    timeline = timeline.concat(DEMOGRAPHICS)
    timeline = timeline.concat(TOM_GRIDWORDS)
    timeline = timeline.concat(THANKYOU)

    // for running online through Pavlovia
    var pavlovia_init = {
        type: "pavlovia",
        command: "init"
    };
    var pavlovia_finish = {
        type: "pavlovia",
        command: "finish"
    };

    if (PAVLOVIA){
        timeline.unshift(pavlovia_init)
        timeline.push(pavlovia_finish)
    }

    jsPsych.init({
        timeline: timeline,
        on_finish: function() {
            if (REDIRECT_URL) {
                window.location = REDIRECT_URL
            }
            // If REDIRECT_URL is null, the participant just stays on
            // the final "thank you" screen shown by pages/thankyou.js.
        },
        show_progress_bar: true,
        auto_update_progress_bar: false,
    })
    
    </script>
