    <body></body>
    
    <!-- Define variables first -->
    <script> 

    // ============================================================
    // Recruitment-platform configuration
    // ------------------------------------------------------------
    // This experiment no longer assumes a specific recruitment
    // platform (e.g. Prolific). Configure these two variables for
    // whichever platform you're using, or leave them as null to
    // just show a plain "you're done" screen with no redirect.
    //
    //   REDIRECT_URL    - where to send participants after they
    //                      finish (e.g. a Prolific/SONA/MTurk
    //                      completion URL). Leave as null for none.
    //   COMPLETION_CODE - a code to display on-screen for the
    //                      participant to enter on the recruitment
    //                      platform. Leave as null to not show one.
    // ============================================================
    var REDIRECT_URL = null
    var COMPLETION_CODE = null

    // Experiment Parameters
    var pid = 'ERROR'                       // Participant ID (read from ?PID= URL parameter, if present)
    var attention_failures = 0              // for attention checks
    var break_threshold = 7 * 60 * 1000     // for how long to give participant before break times out in ms (set to null for indefinite time)
    var break_timed_out = false             // for breaks
    var start_time = Date.now()

    // Initialize variables 
    var gridwords_variables = ''
    var timeline            = []

    // Run style
    var ONLINE = true        // true or false
    var PAVLOVIA = true      // true or false

    if (ONLINE) {
    // Read URL parameter values from the link sent to participant.
    // URL example: https://run.pavlovia.org/neurophilmcgill/video-tom-gitlab/?PID=YOURNAME
        var urlvar = jsPsych.data.urlVariables();
        pid = urlvar.PID
    };

    // Build the full catalogue from the per-actor video-info files loaded
    // above, restricted to the 6 actors already used in the curated core
    // set (numeric actor IDs 1, 9, 10, 12, 13, 14 correspond to F2, M5,
    // F7, F5, F8, M4 respectively). This keeps the random extras within
    // the same actor pool participants already see, and lets us convert
    // "actor" to the same F/M code format used in the curated set below.
    var actor_code_map = { 1: 'F2', 9: 'M5', 10: 'F7', 12: 'F5', 13: 'F8', 14: 'M4' }

    var full_catalogue = []
      .concat(video_info_01, video_info_02, video_info_03, video_info_04,
              video_info_05, video_info_06, video_info_07, video_info_08,
              video_info_09, video_info_10, video_info_11, video_info_12,
              video_info_13, video_info_14)
      .filter(function (v) { return actor_code_map.hasOwnProperty(v.actor) })
      .map(function (v) {
        var code = actor_code_map[v.actor]
        return {
          name: code + '_' + v.target_emotion,
          player_embed_url: v.player_embed_url,
          width: v.width,
          height: v.height,
          actor: code,                    // normalized to the same F/M code format as video_info_selected
          target_emotion: v.target_emotion
        }
      })

    // Exclude any clip already present in the curated core set
    // (matched by Vimeo URL).
    var selected_urls = video_info_selected.map(function (v) { return v.player_embed_url })
    var catalogue_remainder = full_catalogue.filter(function (v) {
      return selected_urls.indexOf(v.player_embed_url) === -1
    })

    // Draw 10 random extra clips from the remainder. This re-samples on
    // every page load, so each participant sees a different set of 10
    // random clips in addition to the fixed curated 30.
    var random_extras = shuffle(catalogue_remainder).slice(0, 10)

    // Combine the curated core set with the random extras, then shuffle
    // the full set so trial order is randomized per participant.
    gridwords_variables = shuffle(video_info_selected.concat(random_extras))

    // Progress bar: 2 increments per stimulus (grid + words), plus 2 attention-check
    // increments, plus 1 for demographics and 1 for consent.
    var PROGRESS_BAR_N = (gridwords_variables.length * 2) + 2 + 2

 </script>


    <!-- Load plugin (requires variables to be defined first) -->
    <script src="pages/tom.js"></script>
    <script src="pages/thankyou.js"></script>
    <script src="pages/welcome-consent.js"></script>
    <script src="pages/demographics-internetspeed-screening.js"></script>


<script>

    timeline = timeline.concat(WELCOMECONSENT)
    timeline = timeline.concat(DEMOGRAPHICS)
    timeline = timeline.concat(TOM_GRIDWORDS)
    timeline = timeline.concat(THANKYOU)

    // for running online through Pavlovia
    var pavlovia_init = {
        type: "pavlovia",
        command: "init"
    };
    var pavlovia_finish = {
        type: "pavlovia",
        command: "finish"
    };

    if (PAVLOVIA){
        timeline.unshift(pavlovia_init)
        timeline.push(pavlovia_finish)
    }

    jsPsych.init({
        timeline: timeline,
        on_finish: function() {
            if (REDIRECT_URL) {
                window.location = REDIRECT_URL
            }
            // If REDIRECT_URL is null, the participant just stays on
            // the final "thank you" screen shown by pages/thankyou.js.
        },
        show_progress_bar: true,
        auto_update_progress_bar: false,
    })
    
    </script>
